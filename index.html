    <script>
      // Auto-recovery mechanism for stale service workers or broken cache
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('Unexpected token') || e.message.includes('Loading chunk') || e.message.includes('Importing a module script failed'))) {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (let registration of registrations) {
                registration.unregister();
              }
              if (!sessionStorage.getItem('sw_recovered')) {
                sessionStorage.setItem('sw_recovered', 'true');
                window.location.reload();
              }
            });
          }
        }
      });

      if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
        window.addEventListener('load', function() {
          try {
            navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function(reg) {
              if (reg && reg.update) {
                reg.update().catch(function() {});
              }
            }).catch(function(err) {
              // Silently handle iframe / sandbox restrictions
            });
          } catch (e) {}
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
